/* ضغط الصورة قبل الرفع: تصغير الأبعاد + تحويل إلى WebP (يحافظ على الشفافية) */
async function compressImage(file,maxSize){
 if(!file.type.startsWith('image/')||file.type==='image/svg+xml'||file.type==='image/gif')return file;
 try{
  const bmp=await createImageBitmap(file);
  const scale=Math.min(1,maxSize/Math.max(bmp.width,bmp.height));
  const w=Math.max(1,Math.round(bmp.width*scale)),h=Math.max(1,Math.round(bmp.height*scale));
  const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext('2d');ctx.drawImage(bmp,0,0,w,h);
  const blob=await new Promise(r=>canvas.toBlob(r,'image/webp',0.82));
  if(!blob||blob.size>=file.size&&scale===1)return file;
  return new File([blob],file.name.replace(/\.[^.]+$/,'')+'.webp',{type:'image/webp'});
 }catch(e){return file}
}
async function uploadFile(file,folder,maxSize=1600){file=await compressImage(file,maxSize);const ext=(file.name.split('.').pop()||'png').toLowerCase(),path=`${folder}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;const up=await db.storage.from('site-assets').upload(path,file,{cacheControl:'31536000',contentType:file.type});if(up.error)throw up.error;return db.storage.from('site-assets').getPublicUrl(path).data.publicUrl}
async function saveRow(table,id,payload,manage=true){try{if(manage)setLoading(true);const r=id?await db.from(table).update(payload).eq('id',id):await db.from(table).insert(payload);if(r.error)throw r.error;toast('تم الحفظ');await loadAll()}catch(err){toast(err.message,true)}finally{if(manage)setLoading(false)}}

function videoUrlFromRow(x){if(x.provider==='youtube')return `https://www.youtube.com/watch?v=${x.video_id}`;if(x.provider==='vimeo')return `https://vimeo.com/${x.video_id}`;if(x.provider==='drive')return `https://drive.google.com/file/d/${x.video_id}/view`;return x.video_id||''}function shortUrl(v){try{const u=new URL(v);return u.hostname.replace(/^www\./,'')+u.pathname.slice(0,30)}catch{return v}}
function parseVideoUrl(value){const url=value.trim();if(!/^https?:\/\//i.test(url))throw new Error('أضف رابط كامل يبدأ بـ http أو https');const u=new URL(url),host=u.hostname.replace(/^www\./,'').toLowerCase();if(host==='youtu.be')return {provider:'youtube',video_id:u.pathname.split('/').filter(Boolean)[0]};if(host.includes('youtube.com')){const q=u.searchParams.get('v');if(q)return {provider:'youtube',video_id:q};const a=u.pathname.split('/').filter(Boolean),i=a.findIndex(x=>['embed','shorts','live'].includes(x));if(i>=0&&a[i+1])return {provider:'youtube',video_id:a[i+1]}}if(host.includes('vimeo.com')){const m=u.pathname.match(/(?:video\/)?(\d{5,})/);if(m)return {provider:'vimeo',video_id:m[1]}}if(host.includes('drive.google.com')){const m=u.pathname.match(/\/file\/d\/([^/]+)/),id=m?.[1]||u.searchParams.get('id');if(id)return {provider:'drive',video_id:id}}return {provider:'url',video_id:url}}
async function loadAll(){try{setLoading(true);const [settings,items,projects,clients,payments,stats]=await Promise.all([db.from('site_settings').select('*'),db.from('content_items').select('*').order('sort_order'),db.from('projects').select('*').order('sort_order'),db.from('clients').select('*').order('sort_order'),db.from('payment_methods').select('*').order('sort_order'),db.from('stats').select('*').order('sort_order')]);for(const r of [settings,items,projects,clients,payments,stats])if(r.error)throw r.error;state.settings=Object.fromEntries(settings.data.map(x=>[x.key,x.value]));state.items=items.data;state.projects=projects.data;state.clients=clients.data;state.payments=payments.data;state.stats=stats.data;renderAll()}catch(err){toast(err.message,true)}finally{setLoading(false)}}
function renderAll(){['home','about','services','why','audience','process','contact'].forEach(renderSettingGroup);Object.keys(itemSections).forEach(renderItems);renderProjects();renderClients();renderPayments();$('countProjects').textContent=state.projects.length;$('countClients').textContent=state.clients.length;$('countItems').textContent=state.items.length;$('countPayments').textContent=state.payments.length}
navInit();loadAll();
</script></body></html>
